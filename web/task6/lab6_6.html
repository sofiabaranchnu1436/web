<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <a class="topbar-link" href="#">Mail</a>
    <a class="topbar-link" href="#">Images</a>

    <div class="popup-wrap">

        <input class="popup-toggle" type="checkbox" id="popup-toggle">

        <label class="popup-button" for="popup-toggle">
            <img class="popup-button-icon" src="icons/popup-button.png" alt="Додатки">
        </label>

        <div class="popup">
            <input class="more-toggle" type="checkbox" id="more-toggle">

            <div class="popup-content" tabindex="0">
                <div class="popup-grid">
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/calendar.png" alt="">
                        <span class="popup-label">Calendar</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/mail.png" alt="">
                        <span class="popup-label">Mail</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/news.png" alt="">
                        <span class="popup-label">News</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/maps.png" alt="">
                        <span class="popup-label">Map</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/files.png" alt="">
                        <span class="popup-label">Files</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/contacts.png" alt="">
                        <span class="popup-label">Contacts</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/translation.png" alt="">
                        <span class="popup-label">Translate</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/videos.png" alt="">
                        <span class="popup-label">Videos</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/search.png" alt="">
                        <span class="popup-label">Search</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/photos.png" alt="">
                        <span class="popup-label">Photo</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/apps.png" alt="">
                        <span class="popup-label">Apps</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/documents.png" alt="">
                        <span class="popup-label">Document</span>
                    </div>
                </div>


                <div class="popup-grid popup-extra">
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/chat.png" alt="">
                        <span class="popup-label">Chat</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/classroom.png" alt="">
                        <span class="popup-label">Classroom</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/collection.png" alt="">
                        <span class="popup-label">Collection</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/mars.png" alt="">
                        <span class="popup-label">Mars</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/blogs.png" alt="">
                        <span class="popup-label">Blogs</span>
                    </div>
                    <div class="popup-item" tabindex="0">
                        <img class="popup-icon" src="icons/promo.png" alt="">
                        <span class="popup-label">Promos</span>
                    </div>
                </div>
            </div>

            <label class="more-button" for="more-toggle">More</label>
        </div>
    </div>

    <img class="bell" src="icons/bell.png" alt="Сповіщення">
    <img class="avatar" src="icons/favicon.png" alt="Профіль">
</header>
</body>
</html>
