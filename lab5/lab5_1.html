<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №5 — Завдання 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Зовнішній div (жовта пунктирна рамка) -->
    <div class="travel-container">
        
        <!-- h1 (синя пунктирна рамка) -->
        <h1>План подорожі:</h1>

        <!-- ul 1-го рівня (зелена пунктирна рамка) -->
        <ul class="main-list">
            
            <!-- li 1-го рівня -->
            <li class="item-checklist">
                <!-- span 1-го рівня (фіолетова пунктирна рамка) -->
                <span class="title-first-level">Підготовчий етап</span>

                <!-- ul 2-го рівня (окремий світло-зелений контейнер) -->
                <ul class="sub-list">
                    <li class="item-route"><span>Обрати маршрут</span></li>
                    <li class="item-flight"><span>Квитки на літак</span></li>
                    <li class="item-hotel"><span>Готель</span></li>
                    <li class="item-car"><span>Оренда авто</span></li>
                </ul>
            </li>

            <!-- li 1-го рівня -->
            <li class="item-checklist">
                <!-- span 1-го рівня -->
                <span class="title-first-level">Відпочинок</span>

                <!-- ul 2-го рівня (окремий світло-зелений контейнер) -->
                <ul class="sub-list">
                    <li class="item-bar"><span>Бари</span></li>
                    <li class="item-casino"><span>Казино</span></li>
                    <li class="item-museum"><span>Музеї</span></li>
                    <li class="item-festival"><span>Фестивалі</span></li>
                </ul>
            </li>

        </ul>
    </div>

</body>
</html>
