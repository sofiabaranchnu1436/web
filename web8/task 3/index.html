<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея фотографій - CSS Grid Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="gallery-container">
    <div class="gallery">
      <!-- Рядок 1: 5 маленьких фото -->
      <div class="gallery-item"><img src="https://picsum.photos/id/1015/400/300" alt="Фото 1"></div>
      <div class="gallery-item"><img src="https://picsum.photos/id/1016/400/300" alt="Фото 2"></div>
      <div class="gallery-item"><img src="https://picsum.photos/id/1018/400/300" alt="Фото 3"></div>
      <div class="gallery-item"><img src="https://picsum.photos/id/1019/400/300" alt="Фото 4"></div>
      <div class="gallery-item"><img src="https://picsum.photos/id/1020/400/300" alt="Фото 5"></div>

      <!-- Рядок 2: 1 панорамне фото на всю ширину -->
      <div class="gallery-item item-wide"><img src="https://picsum.photos/id/1039/1200/400" alt="Панорамне фото"></div>

      <!-- Рядок 3: 5 маленьких фото -->
      <div class="gallery-item"><img src="https://picsum.photos/id/1024/400/300" alt="Фото 6"></div>
      <div class="gallery-item"><img src="https://picsum.photos/id/1025/400/300" alt="Фото 7"></div>
      <div class="gallery-item"><img src="https://picsum.photos/id/1027/400/300" alt="Фото 8"></div>
      <div class="gallery-item"><img src="https://picsum.photos/id/1028/400/300" alt="Фото 9"></div>
      <div class="gallery-item"><img src="https://picsum.photos/id/1033/400/300" alt="Фото 10"></div>
    </div>
  </div>

</body>
</html>
