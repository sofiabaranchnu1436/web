<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №5 — Завдання 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="form-page-body">

    <div class="form-card">
        <h1>Анкета користувача</h1>
        <p class="form-description">Заповніть форму реєстрації та анкетування. Усі поля з позначкою * є обов'язковими.</p>

        <form action="#" method="post" enctype="multipart/form-data">

            <!-- Особисті дані -->
            <fieldset>
                <legend>Особиста інформація</legend>

                <div class="field-group">
                    <label for="fullname">ПІБ *:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Іванов Іван Іванович" required tabindex="1">
                </div>

                <div class="field-group">
                    <label for="pass">Пароль * (6 символів, A-Z, a-z, 0-9):</label>
                    <input type="password" id="pass" name="password" placeholder="Pass12" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6}" required tabindex="2">
                </div>

                <div class="field-group">
                    <label for="email">Email *:</label>
                    <input type="email" id="email" name="user_email" placeholder="example@mail.com" required autocomplete="off" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" tabindex="3">
                </div>

                <div class="field-group">
                    <label for="phone">Телефон * (+380...):</label>
                    <input type="tel" id="phone" name="user_phone" placeholder="+380991234567" pattern="^\+380\d{9}$" required tabindex="4">
                </div>

                <div class="field-group">
                    <label for="birthdate">Дата народження:</label>
                    <input type="date" id="birthdate" name="birthdate" value="2004-01-01" tabindex="5">
                </div>

                <div class="field-group">
                    <label for="city">Місто (підказки):</label>
                    <input type="text" id="city" name="user_city" list="cities-list" placeholder="Оберіть або введіть місто" tabindex="6">
                    <datalist id="cities-list">
                        <option value="Чернівці"></option>
                        <option value="Київ"></option>
                        <option value="Lviv"></option>
                        <option value="Одеса"></option>
                        <option value="Харків"></option>
                    </datalist>
                </div>
            </fieldset>

            <!-- Переваги та вподобання -->
            <fieldset>
                <legend>Вподобання та інформація</legend>

                <!-- Radio block 1 -->
                <div class="field-group">
                    <label>Рівень освіти:</label>
                    <div class="option-list">
                        <label><input type="radio" name="education" value="middle" tabindex="7"> Середня</label>
                        <label><input type="radio" name="education" value="bachelor" tabindex="8"> Бакалавр</label>
                        <label><input type="radio" name="education" value="master" tabindex="9"> Магістр</label>
                    </div>
                </div>

                <!-- Radio block 2 -->
                <div class="field-group">
                    <label>Форма навчання:</label>
                    <div class="option-list">
                        <label><input type="radio" name="study_form" value="day" checked tabindex="10"> Денна (за замовчуванням)</label>
                        <label><input type="radio" name="study_form" value="extramural" tabindex="11"> Заочна</label>
                        <label><input type="radio" name="study_form" value="remote" tabindex="12"> Дистанційна</label>
                    </div>
                </div>

                <!-- Checkbox block -->
                <div class="field-group">
                    <label>Інтереси (улюблені напрямки):</label>
                    <div class="option-list grid-2">
                        <label><input type="checkbox" name="interests" value="web" tabindex="13"> Web-розробка</label>
                        <label><input type="checkbox" name="interests" value="cpp" tabindex="14"> C++ програмування</label>
                        <label><input type="checkbox" name="interests" value="design" tabindex="15"> UI/UX Design</label>
                        <label><input type="checkbox" name="interests" value="qa" tabindex="16"> Тестування (QA)</label>
                    </div>
                </div>

                <!-- Select з selected -->
                <div class="field-group">
                    <label for="country">Країна проживання:</label>
                    <select id="country" name="country" tabindex="17">
                        <option value="poland">Польща</option>
                        <option value="germany">Німеччина</option>
                        <option value="ukraine" selected>Україна (обрано)</option>
                        <option value="usa">США</option>
                        <option value="canada">Канада</option>
                    </select>
                </div>

                <!-- Select multiple -->
                <div class="field-group">
                    <label for="languages">Мови програмування (множинний вибір):</label>
                    <select id="languages" name="languages" multiple size="4" tabindex="18">
                        <option value="cpp">C++</option>
                        <option value="python">Python</option>
                        <option value="js">JavaScript</option>
                        <option value="html_css">HTML/CSS</option>
                        <option value="java">Java</option>
                        <option value="csharp">C#</option>
                    </select>
                </div>

                <!-- Select z optgroup -->
                <div class="field-group">
                    <label for="specialty">Спеціальність (з групуванням):</label>
                    <select id="specialty" name="specialty" tabindex="19">
                        <optgroup label="Факультет математики та інфоматики">
                            <option value="ipz">121 Інженерія програмного забезпечення</option>
                            <option value="kn">122 Комп'ютерні науки</option>
                            <option value="pm">113 Прикладна математика</option>
                        </optgroup>
                        <optgroup label="Фізичний факультет">
                            <option value="ce">123 Комп'ютерна інженерія</option>
                            <option value="se">125 Кібербезпека</option>
                            <option value="sys">124 Системний аналіз</option>
                        </optgroup>
                        <optgroup label="Економічний факультет">
                            <option value="econ">Економічна кібернетика</option>
                            <option value="mng">Менеджмент</option>
                            <option value="mkt">Маркетинг</option>
                        </optgroup>
                        <optgroup label="Гуманітарні напрямки">
                            <option value="phil">Філологія</option>
                            <option value="hist">Історія</option>
                            <option value="law">Право</option>
                        </optgroup>
                    </select>
                </div>
            </fieldset>

            <!-- Додатково -->
            <fieldset>
                <legend>Додаткова інформація</legend>

                <div class="field-group">
                    <label for="audio_files">Завантажте аудіофайли (кілька MP3/WAV):</label>
                    <input type="file" id="audio_files" name="audio_files[]" accept="audio/*" multiple tabindex="20">
                </div>

                <div class="field-group">
                    <label for="about">Розповісти про себе:</label>
                    <textarea id="about" name="about_user" rows="4" placeholder="Ваші захоплення, досвід та очікування..." tabindex="21"></textarea>
                </div>
            </fieldset>

            <!-- Кнопки -->
            <div class="form-buttons">
                <button type="submit" tabindex="22">Надіслати анкету</button>
                <button type="reset" tabindex="23">Очистити форму</button>
            </div>

        </form>
    </div>

</body>
</html>
